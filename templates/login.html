<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>로그인</title>

<style>

body {
    font-family: sans-serif;
    margin: 30px;
    max-width: 480px;
}

h2 {
    margin-bottom: 20px;
}

.field {
    margin-bottom: 16px;
}

.field label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

.field input[type="text"], .field input[type="password"] {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
}

.error {
    color: #c00;
    margin-bottom: 16px;
}

button {
    padding: 8px 16px;
    cursor: pointer;
}

.links {
    margin-top: 16px;
}

</style>

</head>

<body>

<h2>로그인</h2>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post" action="{{ url_for('login') }}">

    <div class="field">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" value="{{ username }}" required>
    </div>

    <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" required>
    </div>

    <button type="submit">로그인</button>

</form>

<p class="links">계정이 없으신가요? <a href="{{ url_for('signup') }}">회원가입</a></p>

</body>

</html>
