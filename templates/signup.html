<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>회원가입</title>

<style>

body {
    font-family: sans-serif;
    margin: 30px;
    max-width: 480px;
}

h2 {
    margin-bottom: 20px;
}

.field {
    margin-bottom: 16px;
}

.field label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

.field input[type="text"], .field input[type="password"] {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
}

.checkbox-group {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}

.checkbox-group label {
    font-weight: normal;
    display: flex;
    align-items: center;
    gap: 4px;
}

.required {
    color: #c00;
    font-weight: normal;
}

.error {
    color: #c00;
    margin-bottom: 16px;
}

button {
    padding: 8px 16px;
    cursor: pointer;
}

.links {
    margin-top: 16px;
}

</style>

</head>

<body>

<h2>회원가입</h2>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post" action="{{ url_for('signup') }}">

    <div class="field">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" value="{{ username }}" required>
    </div>

    <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" required>
    </div>

    <div class="field">
        <label for="password_confirm">비밀번호 확인</label>
        <input type="password" id="password_confirm" name="password_confirm" required>
    </div>

    <div class="field">
        <label>희망 직무 <span class="required">(필수, 1개 이상 선택)</span></label>
        <div class="checkbox-group">
            {% for name in job_categories %}
            <label>
                <input type="checkbox" name="job_category" value="{{ name }}"
                    {% if name in selected_job_categories %}checked{% endif %}>
                {{ name }}
            </label>
            {% endfor %}
        </div>
    </div>

    <button type="submit">가입하기</button>

</form>

<p class="links">이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a></p>

</body>

</html>
